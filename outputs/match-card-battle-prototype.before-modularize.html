<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五色珠卡牌戰鬥原型</title>
  <style>
    :root {
      --bg: #101318;
      --panel: #181d24;
      --panel-2: #202630;
      --line: #313947;
      --text: #f5f0e6;
      --muted: #aeb7c5;
      --red: #e84b4b;
      --green: #39b86b;
      --yellow: #e9c94b;
      --light: #f2f0dc;
      --dark: #7b55c7;
      --gold: #d9a441;
      --blood: #9b2f27;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(154, 66, 47, 0.22) 0, transparent 24rem),
        linear-gradient(145deg, #191412 0%, #101318 44%, #16100f 100%);
      color: var(--text);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: start center;
      overflow-y: auto;
      padding: clamp(8px, 2vh, 18px);
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #2b3340;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #354052;
    }

    .app {
      width: min(980px, 100%);
      display: grid;
      gap: 10px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: grid;
    }

    .menu-screen {
      min-height: calc(100vh - 28px);
      align-content: center;
      gap: 14px;
    }

    .hero-panel,
    .chapter-panel,
    .home-panel {
      position: relative;
      overflow: hidden;
      min-height: min(740px, calc(100vh - 28px));
      display: grid;
      align-content: end;
      gap: 16px;
      padding: 28px;
      border: 1px solid #4b3b2d;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(14, 16, 20, 0.2), rgba(14, 16, 20, 0.88)),
        radial-gradient(circle at 78% 24%, rgba(189, 48, 40, 0.38), transparent 22rem),
        linear-gradient(135deg, #342019, #14171e 52%, #24130f);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
    }

    .hero-panel {
      align-content: space-between;
      justify-items: center;
      text-align: center;
    }

    .war-sigil {
      position: absolute;
      top: 42px;
      right: 44px;
      width: 230px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px solid rgba(217, 164, 65, 0.38);
      border-radius: 50%;
      color: rgba(217, 164, 65, 0.72);
      font-size: 92px;
      font-weight: 900;
      box-shadow: inset 0 0 44px rgba(217, 164, 65, 0.12);
      transform: rotate(-9deg);
    }

    .ink-army {
      position: absolute;
      inset: auto 0 0 0;
      height: 42%;
      opacity: 0.28;
      background:
        linear-gradient(70deg, transparent 10%, #0b0d12 10% 14%, transparent 14% 21%, #0b0d12 21% 25%, transparent 25% 33%, #0b0d12 33% 38%, transparent 38%),
        linear-gradient(0deg, #05070a, transparent 78%);
      clip-path: polygon(0 36%, 12% 28%, 18% 40%, 29% 21%, 38% 38%, 48% 25%, 56% 43%, 66% 20%, 77% 41%, 88% 26%, 100% 38%, 100% 100%, 0 100%);
    }

    .menu-copy {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
      max-width: 620px;
    }

    .hero-panel .menu-copy {
      justify-items: center;
      align-self: end;
    }

    .eyebrow {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 0;
    }

    .title {
      font-size: clamp(38px, 8vw, 76px);
      line-height: 0.95;
      font-weight: 900;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.72);
    }

    .menu-copy p {
      max-width: 560px;
      color: #d8c9b4;
      line-height: 1.6;
    }

    .primary-action {
      width: fit-content;
      min-height: 44px;
      padding: 8px 22px;
      border-color: var(--gold);
      background: linear-gradient(180deg, #9b2f27, #571914);
      color: #fff2cf;
      font-weight: 800;
    }

    .main-menu-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .menu-tile {
      min-height: 132px;
      display: grid;
      align-content: end;
      gap: 6px;
      padding: 16px;
      border: 1px solid #614a31;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(217, 164, 65, 0.1), rgba(8, 10, 14, 0.74)),
        rgba(24, 18, 15, 0.86);
      color: #f7e1b7;
      text-align: left;
    }

    .menu-tile strong {
      font-size: 24px;
      line-height: 1;
    }

    .menu-tile span {
      color: #b9a78b;
      font-size: 13px;
    }

    .battle-topbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      position: absolute;
      z-index: 9;
      top: 16px;
      right: 16px;
      margin-bottom: 0;
    }

    .battle-topbar button,
    .chapter-head button {
      min-height: 34px;
      padding: 5px 12px;
    }

    .command-orb {
      min-width: 58px;
      border-color: rgba(214, 168, 74, 0.64);
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 25%, rgba(214, 168, 74, 0.22), transparent 45%),
        linear-gradient(180deg, rgba(34, 25, 15, 0.94), rgba(4, 5, 6, 0.96));
      color: #f3dfad;
      font-weight: 900;
      box-shadow:
        inset 0 0 14px rgba(0, 0, 0, 0.72),
        0 0 12px rgba(214, 168, 74, 0.18);
    }

    .chapter-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .stage-map {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .stage-node {
      min-height: 76px;
      display: grid;
      gap: 4px;
      align-content: center;
      border-color: #614a31;
      background: rgba(23, 18, 16, 0.82);
      color: #f7e1b7;
      font-weight: 800;
    }

    .stage-node small {
      color: #b9a78b;
      font-size: 12px;
      font-weight: 600;
    }

    .roster-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-self: stretch;
    }

    .roster-card {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 12px;
      padding: 10px;
      border: 1px solid #514235;
      border-radius: 8px;
      background: rgba(12, 15, 21, 0.82);
      color: #f4e6cc;
      min-height: 138px;
    }

    .roster-card img {
      width: 96px;
      height: 124px;
      border-radius: 6px;
      object-fit: cover;
      background: #090c12;
      border: 1px solid rgba(217, 164, 65, 0.24);
    }

    .roster-info {
      display: grid;
      align-content: start;
      gap: 6px;
      min-width: 0;
    }

    .roster-info strong {
      font-size: 20px;
      line-height: 1.1;
    }

    .roster-meta {
      color: #d9a441;
      font-size: 13px;
      font-weight: 800;
    }

    .roster-skill,
    .roster-flavor {
      color: #c9d2df;
      font-size: 12px;
      line-height: 1.45;
    }

    .hero-profile-card {
      width: min(760px, 100%);
      justify-self: center;
      display: block;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.48);
      color: #f5e8c8;
    }

    .hero-profile-card > img {
      width: 100%;
      display: block;
    }

    .hero-profile-head {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px 16px;
      background: linear-gradient(90deg, rgba(12, 18, 28, 0.94), rgba(71, 52, 23, 0.82));
      border-bottom: 1px solid rgba(230, 196, 116, 0.35);
    }

    .hero-profile-element {
      width: 58px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 3px solid #f3d98f;
      color: #200b07;
      font-size: 24px;
      font-weight: 900;
    }

    .hero-stars {
      color: #57d6ff;
      font-size: 18px;
      letter-spacing: 0;
    }

    .hero-cost {
      color: #fff;
      font-size: 26px;
      font-weight: 900;
    }

    .hero-profile-art {
      height: auto;
      display: grid;
      place-items: center;
      padding: 30px 46px 26px;
      background:
        radial-gradient(circle at 50% 72%, rgba(255, 225, 140, 0.24), transparent 34%),
        linear-gradient(90deg, rgba(8, 10, 14, 0.72), rgba(25, 34, 46, 0.24), rgba(8, 10, 14, 0.72));
    }

    .hero-profile-art img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      object-position: center;
      border: 2px solid #b88a2e;
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.55));
    }

    .hero-profile-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: rgba(230, 196, 116, 0.25);
      border-top: 1px solid rgba(230, 196, 116, 0.35);
      border-bottom: 1px solid rgba(230, 196, 116, 0.35);
    }

    .hero-profile-stat {
      display: grid;
      gap: 2px;
      padding: 14px 22px;
      background: rgba(11, 13, 18, 0.88);
    }

    .hero-profile-stat span,
    .hero-skill-kind {
      color: #b8c3d4;
      font-size: 12px;
      font-weight: 800;
    }

    .hero-profile-stat strong {
      font-size: 34px;
      font-weight: 500;
    }

    .hero-skill-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 20px 26px;
      border-bottom: 1px solid rgba(230, 196, 116, 0.2);
      background: rgba(8, 10, 14, 0.72);
    }

    .hero-skill-row img {
      width: 66px;
      height: 66px;
      border-radius: 8px;
      border: 1px solid rgba(230, 196, 116, 0.34);
    }

    .hero-skill-text {
      display: grid;
      gap: 4px;
      line-height: 1.45;
    }

    .hero-skill-text strong {
      font-size: 24px;
      font-weight: 500;
    }

    .screen.game {
      width: min(820px, 100%);
      gap: 8px;
      align-items: start;
      overflow: visible;
    }

    .screen.game.active {
      display: grid;
    }

    .screen.game.active > .battlefield {
      display: grid;
    }

    .screen:not(.active) {
      display: none;
    }

    .battle,
    .team-panel,
    .log-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(23, 18, 13, 0.96), rgba(8, 10, 14, 0.98)),
        #101318;
      box-shadow:
        0 0 0 2px rgba(204, 149, 61, 0.12),
        0 24px 80px rgba(0, 0, 0, 0.42);
    }

    .log-panel {
      visibility: hidden;
      height: 0;
      min-height: 0;
      overflow: hidden;
      padding: 0;
      border: 0;
      box-shadow: none;
    }

    .battle {
      position: relative;
      padding: clamp(7px, 1.2vh, 12px);
      border-color: rgba(196, 145, 64, 0.42);
      background:
        radial-gradient(circle at 50% 0%, rgba(181, 76, 39, 0.16), transparent 26rem),
        linear-gradient(180deg, rgba(20, 16, 12, 0.98), rgba(8, 10, 14, 0.98));
      overflow: hidden;
    }

    .battle::before {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 0;
      border: 1px solid rgba(222, 173, 88, 0.2);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.66);
    }

    .battle > * {
      position: relative;
      z-index: 1;
    }

    .battle.hurt {
      animation: screenHurt 520ms ease;
    }

    .team-panel,
    .log-panel {
      padding: 12px;
    }

    .enemy {
      min-height: 0;
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      align-items: center;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .enemy-art {
      position: relative;
      width: min(100%, 780px);
      height: clamp(330px, 43vh, 500px);
      justify-self: center;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background:
        radial-gradient(ellipse at 50% 82%, rgba(0, 0, 0, 0.46), transparent 24%),
        linear-gradient(180deg, rgba(80, 116, 148, 0.72), rgba(19, 35, 52, 0.8) 46%, rgba(15, 20, 27, 0.86)),
        linear-gradient(145deg, #35536b, #172332 64%);
      border: 0;
      overflow: visible;
      isolation: isolate;
      perspective: 900px;
      background-image:
        radial-gradient(circle at 50% 72%, rgba(255, 101, 35, 0.16), transparent 20%),
        linear-gradient(180deg, rgba(11, 16, 24, 0.02), rgba(11, 16, 24, 0.66)),
        url("assets/bg-hulao-demon-gate.png");
      background-size: cover;
      background-position: center 58%;
      box-shadow:
        inset 0 0 0 1px rgba(221, 173, 93, 0.16),
        inset 0 -90px 82px rgba(0, 0, 0, 0.62),
        0 10px 28px rgba(0, 0, 0, 0.38);
    }

    .enemy-art::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border: 1px solid rgba(217, 164, 65, 0.2);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.36), transparent 18%, transparent 82%, rgba(0,0,0,0.42)),
        linear-gradient(180deg, rgba(255, 214, 121, 0.06), transparent 12%, transparent 78%, rgba(0, 0, 0, 0.44));
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.5);
    }

    .enemy-art::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 16px;
      z-index: 1;
      width: 46%;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.72), transparent 70%);
      transform: translateX(-50%);
      filter: blur(2px);
    }

    .enemy-art img {
      position: relative;
      z-index: 2;
      width: min(58%, 430px);
      height: 113%;
      object-fit: contain;
      object-position: center bottom;
      transform-origin: center bottom;
      filter: drop-shadow(0 18px 20px rgba(0, 0, 0, 0.72));
      animation: enemyBreath 2.6s ease-in-out infinite;
    }

    .stage-smoke,
    .stage-embers,
    .attack-effect-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
      border-radius: 8px;
    }

    .stage-smoke {
      z-index: 1;
      background:
        radial-gradient(ellipse at 25% 78%, rgba(120, 120, 120, 0.16), transparent 28%),
        radial-gradient(ellipse at 76% 80%, rgba(80, 80, 80, 0.14), transparent 30%),
        linear-gradient(180deg, transparent 58%, rgba(0, 0, 0, 0.5));
      filter: blur(5px);
      animation: smokeDrift 7s ease-in-out infinite;
    }

    .stage-embers {
      z-index: 3;
      opacity: 0.82;
      background-image:
        radial-gradient(circle, rgba(255, 116, 44, 0.88) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(214, 168, 74, 0.78) 0 1px, transparent 2px);
      background-size: 92px 120px, 140px 170px;
      background-position: 20px 80px, 70px 30px;
      mix-blend-mode: screen;
      animation: emberRise 6s linear infinite;
    }

    .attack-effect-layer {
      z-index: 7;
      display: grid;
      place-items: center;
    }

    .attack-effect {
      position: absolute;
      inset: 0;
      animation: attackEffectFade 620ms ease-out forwards;
    }

    .attack-effect.slash::before,
    .attack-effect.slash::after {
      content: "";
      position: absolute;
      left: 20%;
      top: 50%;
      width: 64%;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255, 42, 35, 0.95), rgba(255, 235, 190, 0.9), transparent);
      box-shadow: 0 0 26px rgba(255, 38, 28, 0.92);
      transform: rotate(-22deg);
    }

    .attack-effect.slash::after {
      top: 42%;
      transform: rotate(-16deg);
      opacity: 0.7;
    }

    .attack-effect.poison {
      background:
        radial-gradient(circle at 48% 68%, rgba(69, 255, 105, 0.32), transparent 26%),
        radial-gradient(circle at 58% 56%, rgba(27, 126, 42, 0.34), transparent 32%);
      filter: blur(8px);
    }

    .attack-effect.fire {
      background:
        radial-gradient(circle at 50% 70%, rgba(255, 72, 24, 0.58), transparent 20%),
        radial-gradient(circle at 50% 76%, rgba(255, 170, 56, 0.44), transparent 32%);
      filter: blur(4px);
    }

    .attack-effect.dark {
      background:
        radial-gradient(circle at 50% 58%, rgba(126, 73, 255, 0.34), transparent 30%),
        conic-gradient(from 0deg, transparent, rgba(126, 73, 255, 0.28), transparent, rgba(126, 73, 255, 0.2), transparent);
    }

    .attack-effect.thunder::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 4%;
      width: 9px;
      height: 75%;
      background: linear-gradient(180deg, #fff, #ffd85c 34%, #8fd7ff 68%, transparent);
      clip-path: polygon(50% 0, 82% 30%, 58% 30%, 90% 64%, 49% 42%, 66% 42%, 20% 100%, 36% 50%, 12% 50%);
      filter: drop-shadow(0 0 18px #fff7a8) drop-shadow(0 0 32px #6ebcff);
      transform: translateX(-50%);
    }

    .enemy-debuffs {
      position: absolute;
      z-index: 4;
      top: 18px;
      right: 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
    }

    .enemy-debuff {
      display: inline-grid;
      grid-template-columns: 26px auto;
      gap: 4px;
      align-items: center;
      padding: 3px 6px 3px 3px;
      border: 1px solid rgba(178, 28, 20, 0.78);
      border-radius: 6px;
      background: rgba(22, 7, 11, 0.84);
      color: #ffd66b;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 0 14px rgba(255, 61, 49, 0.28);
    }

    .enemy-debuff img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(255, 61, 49, 0.55));
      animation: none;
    }

    .enemy-art.hit {
      animation: enemyHit 260ms ease;
    }

    .enemy-art.skill-hit {
      animation: skillHit 520ms ease;
    }

    .enemy-art.attack {
      animation: enemyAttack 520ms ease;
    }

    .enemy-art.enemy-charging::before {
      box-shadow:
        inset 0 0 80px rgba(0, 0, 0, 0.5),
        inset 0 0 90px rgba(195, 20, 18, 0.22);
    }

    .enemy-sprite.enemy-windup {
      animation: enemyWindup 150ms ease-out forwards;
      filter:
        drop-shadow(0 18px 20px rgba(0, 0, 0, 0.72))
        drop-shadow(0 0 28px rgba(210, 26, 18, 0.88))
        brightness(1.18);
    }

    .enemy-sprite.enemy-lunge {
      z-index: 12;
      animation: enemyLunge 180ms cubic-bezier(.16, .82, .24, 1) forwards;
      filter:
        drop-shadow(0 28px 22px rgba(0, 0, 0, 0.72))
        drop-shadow(0 0 34px rgba(255, 66, 42, 0.9))
        brightness(1.34)
        saturate(1.18);
    }

    .enemy-afterimage {
      position: absolute;
      z-index: 8;
      object-fit: contain;
      object-position: center bottom;
      opacity: 0.32;
      pointer-events: none;
      filter: blur(3px) brightness(1.25) sepia(0.4) hue-rotate(-18deg);
      transform-origin: center bottom;
      animation: enemyAfterimage 330ms ease-out forwards;
    }

    .battle-party.target-hit,
    .hero-card.target-hit {
      animation: targetHitFlash 260ms ease;
    }

    .attack-effect.impact {
      background:
        radial-gradient(circle at 50% 62%, rgba(255, 238, 190, 0.42), transparent 18%),
        radial-gradient(circle at 50% 66%, rgba(172, 16, 12, 0.54), transparent 34%);
      mix-blend-mode: screen;
    }

    .enemy-art.dead {
      animation: enemyDeath 720ms ease forwards;
    }

    .enemy-info {
      position: absolute;
      z-index: 6;
      left: clamp(14px, 4vw, 44px);
      right: clamp(14px, 4vw, 44px);
      bottom: 18px;
      display: grid;
      gap: 6px;
      color: #f4dfb7;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.86);
    }

    .boss-hp-bar {
      position: relative;
      height: 24px;
      border-radius: 2px;
      border-color: rgba(214, 168, 74, 0.76);
      background:
        linear-gradient(180deg, rgba(36, 23, 16, 0.9), rgba(4, 4, 5, 0.94));
    }

    .boss-hp-bar .bar-fill {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.22), transparent 38%),
        linear-gradient(90deg, #661010 0%, #c12626 55%, #ff6040 100%);
      box-shadow: inset 0 0 10px rgba(255, 158, 86, 0.36);
    }

    .boss-hp-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f8e8bd;
      font-weight: 900;
      text-shadow: 0 2px 4px #000, 0 0 10px rgba(255, 64, 38, 0.4);
      pointer-events: none;

        inset 0 0 24px rgba(0, 0, 0, 0.62);

    .orb {
      position: relative;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      min-width: 0;
      min-height: 0;
      background: transparent center / contain no-repeat;
      box-shadow: none;
      filter: drop-shadow(0 5px 7px rgba(0, 0, 0, 0.44));
      transition: transform 90ms ease, filter 120ms ease, opacity 160ms ease;
    }

    .gem-cell {
      background-color: #0c0c0d;
      background-image:
        radial-gradient(circle at 35% 28%, rgba(255,255,255,0.05), transparent 26%),

      border: 1px solid rgba(138, 106, 42, 0.2);
      border-radius: 4px;
      box-shadow:
        inset 0 1px 0 rgba(255, 232, 180, 0.06),
        inset 0 -8px 16px rgba(0, 0, 0, 0.42);
    }

    .gem {
      filter:
        drop-shadow(0 6px 7px rgba(0, 0, 0, 0.62))
        drop-shadow(0 0 10px rgba(255, 255, 255, 0.08));
    }

    .gem:hover {
      transform: scale(1.08);
      filter:
        drop-shadow(0 8px 8px rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 16px rgba(214, 168, 74, 0.28));
    }

    .orb.red {
      background: url("assets/FIRE STONE CLEAN.png") center / 112% 112% no-repeat;
    }

    .orb.extra-fire {
      background: url("assets/EXTRA FIRE STONE CLEAN.png") center / 112% 112% no-repeat;
    }

    .orb.rainbow {
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,0.92), transparent 16%),
        conic-gradient(#ff4d4d, #ffe45a, #54e084, #69c9ff, #8e66dc, #ff4d4d);
      border-radius: 50%;
      box-shadow:
        inset 0 -12px 14px rgba(0, 0, 0, 0.28),
        0 0 18px rgba(255, 255, 255, 0.56),
        0 5px 9px rgba(0, 0, 0, 0.42);
    }

    .orb.green {
      background: url("assets/EARTH STONE CLEAN.png") center / 112% 112% no-repeat;
    }

    .orb.yellow {
      background: url("assets/SPARK STONE CLEAN.png") center / 112% 112% no-repeat;
    }

    .orb.light {
      background: url("assets/LIGHT STONE CLEAN.png") center / 112% 112% no-repeat;
    }

    .orb.dark {
      background: url("assets/DARK STONE CLEAN.png") center / 112% 112% no-repeat;
    }

    .orb.swap-left { animation: swapLeft 190ms ease both; }
    .orb.swap-right { animation: swapRight 190ms ease both; }
    .orb.swap-up { animation: swapUp 190ms ease both; }
    .orb.swap-down { animation: swapDown 190ms ease both; }

    .orb::before {
      content: "";
      position: relative;
      z-index: 1;
      width: 82%;
      height: 88%;
      background: none;
      filter: none;
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 2;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 22%, rgba(255, 255, 255, 0.18), transparent 18%);
      pointer-events: none;
    }

    .orb.selected {
      outline: 0;
      box-shadow:
        inset 0 12px 12px rgba(255, 255, 255, 0.14),
        inset 0 -13px 14px rgba(0, 0, 0, 0.34),
        0 0 0 4px rgba(214, 168, 74, 0.96),
        0 0 22px rgba(214, 168, 74, 0.82),
        0 5px 10px rgba(0, 0, 0, 0.34);
      z-index: 2;
    }

    .orb.matched {
      opacity: 0;
      transform: scale(0.4);
      animation: orbBurst 330ms ease both;
    }

    .orb.drop {
      animation: orbDrop 390ms cubic-bezier(.18,.8,.28,1.1) both;
    }

    .orb.special {
      background-image: none;
      box-shadow:
        inset 0 12px 12px rgba(255, 255, 255, 0.32),
        inset 0 -13px 14px rgba(0, 0, 0, 0.28),
        0 0 0 3px rgba(255, 255, 255, 0.42),
        0 0 20px currentColor,
        0 5px 10px rgba(0, 0, 0, 0.34);
      animation: specialPulse 1.15s ease-in-out infinite;
    }

    .orb.same-color-token {
      box-shadow:
        inset 0 12px 12px rgba(255, 255, 255, 0.34),
        inset 0 -13px 14px rgba(0, 0, 0, 0.28),
        0 0 0 4px rgba(255, 255, 255, 0.58),
        0 0 26px currentColor,
        0 0 46px currentColor,
        0 5px 10px rgba(0, 0, 0, 0.34);
      animation: flagAura 1.1s ease-in-out infinite;
    }

    .orb.special::before {
      content: "";
      position: absolute;
      inset: -4px;
      width: auto;
      height: auto;
      border: 0;
      border-radius: 0;
      background: url("assets/ORDER CLEAN.png") center / contain no-repeat;
      filter: drop-shadow(0 0 10px currentColor) drop-shadow(0 4px 5px rgba(0,0,0,0.5));
    }

    .orb.same-color-token::before {
      inset: -3px;
      background: url("assets/GOD CLEAN.png") center / contain no-repeat;
      filter: drop-shadow(0 0 14px currentColor) drop-shadow(0 0 28px currentColor) drop-shadow(0 5px 6px rgba(0,0,0,0.55));
    }

    .orb.same-color-token::after {
      inset: -5px;
      border-radius: 14px;
      background:
        conic-gradient(from 0deg, transparent, rgba(255, 218, 91, 0.74), rgba(255, 76, 45, 0.62), transparent, rgba(255, 218, 91, 0.62), transparent);
      filter: blur(3px);
      animation: flagFlame 1s linear infinite;
    }

    .red { background: radial-gradient(circle at 34% 26%, #ff9d9d, var(--red) 42%, #8f2525); }

    .beam {

      transform-origin: left center;
      animation: beamShoot 520ms ease-out forwards;

    .result.flash {

    }

    .bottom-nav {
      width: min(100%, 780px);
      justify-self: center;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
      padding: 8px 10px 10px;
      border: 1px solid rgba(138, 106, 42, 0.48);
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(25, 19, 13, 0.94), rgba(4, 5, 6, 0.96));

        inset 0 0 16px rgba(0, 0, 0, 0.76),
        0 -4px 18px rgba(0, 0, 0, 0.34);

    .bottom-nav button {
      min-height: 46px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid rgba(138, 106, 42, 0.48);
      background:
        radial-gradient(circle at 50% 25%, rgba(214, 168, 74, 0.18), transparent 42%),
        linear-gradient(180deg, #17120d, #060607);
      color: #d9c38b;
      font-size: 12px;
      font-weight: 900;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.72);
    }

    .bottom-nav button.active {
      color: #ffe28a;
      border-color: rgba(214, 168, 74, 0.9);
      box-shadow:
        0 0 18px rgba(255, 164, 38, 0.42),
        inset 0 0 16px rgba(255, 164, 38, 0.18);
    }

    .damage-float {
      position: fixed;
      z-index: 20;
      color: var(--damage-color, #ffe2a3);
      font-weight: 900;
      font-size: 30px;
      text-shadow: 0 3px 8px rgba(0,0,0,0.8), 0 0 18px currentColor;
      pointer-events: none;
      animation: damageFloat 1120ms ease-out forwards;
    }

    .combo-pop {
      position: fixed;
      z-index: 25;
      display: grid;
      gap: 0;
      min-width: 190px;
      padding: 8px 18px 10px;
      border: 4px solid #b21c14;
      border-radius: 10px;
      background:
        linear-gradient(180deg, #fff07a 0%, #ffd145 52%, #f19b24 100%);
      color: #7a0906;
      font-weight: 900;
      font-size: clamp(28px, 5.5vw, 52px);
      line-height: 0.95;
      text-align: center;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.78),
        0 4px 0 rgba(102, 18, 9, 0.2);
      box-shadow:
        0 0 0 3px rgba(255, 240, 122, 0.48),
        0 14px 26px rgba(0, 0, 0, 0.46),
        inset 0 -5px 0 rgba(157, 52, 9, 0.22);
      pointer-events: none;
      animation: comboPop 780ms ease-out forwards;
    }

    .combo-pop small {
      color: #1c1205;
      font-size: 0.42em;
      letter-spacing: 0;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);

    .player-damage-float {
      position: fixed;
      z-index: 24;
      color: #ff4d4d;
      font-weight: 900;
      font-size: 32px;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.86), 0 0 18px rgba(255, 45, 45, 0.58);
      pointer-events: none;
      animation: playerDamageFloat 1120ms ease-out forwards;
    }

    .claw-slash {
      position: fixed;
      z-index: 23;
      width: 150px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255, 36, 36, 0.92), rgba(255, 220, 220, 0.9), rgba(255, 36, 36, 0.78), transparent);
      box-shadow: 0 0 16px rgba(255, 36, 36, 0.78), 0 0 32px rgba(180, 0, 0, 0.5);
      pointer-events: none;
      transform-origin: center;
      animation: clawSlash 520ms ease-out forwards;
    }

    @keyframes orbEnter {
      from { transform: translateY(-22px) scale(0.88); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes orbDrop {
      from { transform: translateY(-46px) scale(0.96); }
      70% { transform: translateY(4px) scale(1.02); }
      to { transform: translateY(0) scale(1); }
    }

    @keyframes swapLeft {
      from { transform: translateX(66px); }
      to { transform: translateX(0); }
    }

    @keyframes swapRight {
      from { transform: translateX(-66px); }
      to { transform: translateX(0); }
    }

    @keyframes swapUp {
      from { transform: translateY(66px); }
      to { transform: translateY(0); }
    }

    @keyframes swapDown {
      from { transform: translateY(-66px); }
      to { transform: translateY(0); }
    }

    @keyframes orbBurst {
      0% { opacity: 1; transform: scale(1); filter: brightness(1); }
      55% { opacity: 1; transform: scale(1.28); filter: brightness(1.8); }
      100% { opacity: 0; transform: scale(0.22); filter: brightness(2.2); }
    }

    @keyframes specialPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.35); }
    }

    @keyframes flagAura {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.42) saturate(1.25); }
    }

    @keyframes flagFlame {
      to { transform: rotate(360deg); }
    }

    @keyframes enemyIdle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.01); }
    }

    @keyframes enemyBreath {
      0%, 100% { transform: translateY(0) rotateX(0deg) scale(1); }
      50% { transform: translateY(-7px) rotateX(2deg) scale(1.035); }
    }

    @keyframes enemyHit {
      0%, 100% { transform: translateX(0); filter: brightness(1); }
      35% { transform: translateX(-8px); filter: brightness(1.8); }
      70% { transform: translateX(7px); }
    }

    @keyframes skillHit {
      0% { transform: scale(1); filter: brightness(1); }
      30% { transform: scale(1.08); filter: brightness(2.1); box-shadow: 0 0 42px rgba(255,255,255,0.36); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes enemyAttack {
      0% { transform: translateY(0) scale(1); filter: brightness(1); }
      20% { transform: translateY(0) scale(1.05); filter: brightness(1.25); }
      45% { transform: translateY(20px) scale(1.08); filter: brightness(1.55) saturate(1.25); }
      78% { transform: translateY(-4px) scale(0.98); }
      100% { transform: translateY(0) scale(1); filter: brightness(1); }
    }

    @keyframes enemyWindup {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(12px) scale(1.08) rotateX(-5deg); }
    }

    @keyframes enemyLunge {
      0% { transform: translateY(12px) scale(1.08); }
      60% { transform: translateY(92px) scale(1.22); filter: blur(1px) brightness(1.45); }
      100% { transform: translateY(80px) scale(1.2); filter: blur(0) brightness(1.35); }
    }

    @keyframes enemyReturn {
      0% { transform: translateY(80px) scale(1.2); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes enemyAfterimage {
      0% { opacity: 0.34; transform: translateY(8px) scale(1.05); }
      100% { opacity: 0; transform: translateY(68px) scale(1.17); }
    }

    @keyframes targetHitFlash {
      0%, 100% { filter: none; transform: translateY(0); }
      35% { filter: brightness(1.65) sepia(0.4) saturate(1.9) hue-rotate(-28deg); transform: translateY(4px); }
      70% { filter: brightness(1.22); transform: translateY(-2px); }
    }

    @keyframes enemyDeath {
      0% { transform: translateY(0) scale(1); filter: grayscale(0) brightness(1); opacity: 1; }
      45% { transform: translateY(0) scale(1.03); filter: grayscale(0.6) brightness(1.45); opacity: 1; }
      100% { transform: translateY(18px) scale(0.96); filter: grayscale(1) brightness(0.55); opacity: 0.62; }
    }

    @keyframes boardShake {
      0%, 100% { transform: translateX(0); }
      33% { transform: translateX(-5px); }
      66% { transform: translateX(5px); }
    }

    @keyframes battleShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 2px); }
      42% { transform: translate(4px, -2px); }
      62% { transform: translate(-3px, -1px); }
      82% { transform: translate(3px, 1px); }
    }

    @keyframes smokeDrift {
      0%, 100% { transform: translateX(-1%) translateY(0); opacity: 0.74; }
      50% { transform: translateX(1.5%) translateY(-2%); opacity: 0.92; }
    }

    @keyframes emberRise {
      0% { background-position: 20px 90px, 70px 45px; opacity: 0.55; }
      50% { opacity: 0.9; }
      100% { background-position: 20px -180px, 70px -220px; opacity: 0.42; }
    }

    @keyframes attackEffectFade {
      0% { opacity: 0; transform: scale(0.86); }
      16% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(1.18); }
    }

    .battlefield.shake {
      animation: battleShake 260ms ease;
    }

    @keyframes resultFlash {
      0% { transform: scale(1); filter: brightness(1); color: #8be38b; }
      45% { transform: scale(1.16); filter: brightness(2); color: #f8ff9a; }
      100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes damageFloat {
      0% { opacity: 0; transform: translate(-50%, 18px) scale(0.82); }
      15% { opacity: 1; transform: translate(-50%, 0) scale(1.04); }
      100% { opacity: 0; transform: translate(-50%, -58px) scale(1); }
    }

    @keyframes comboPop {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-5deg) scale(0.52); }
      18% { opacity: 1; transform: translate(-50%, -50%) rotate(3deg) scale(1.18); }
      55% { opacity: 1; transform: translate(-50%, -50%) rotate(-1deg) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -78%) rotate(2deg) scale(0.92); }
    }

    @keyframes cardPulse {
      0%, 100% { transform: translateY(0); filter: brightness(1); }
      45% { transform: translateY(-5px); filter: brightness(1.55); }
    }

    @keyframes cardDamageFloat {
      0% { opacity: 0; transform: translate(-50%, 8px) scale(0.82); }
      16% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
      100% { opacity: 0; transform: translate(-50%, -32px) scale(1); }
    }

    @keyframes chargePulse {
      0% { transform: translateX(-50%) scale(0.82); filter: brightness(1); }
      42% { transform: translateX(-50%) scale(1.18); filter: brightness(1.6); }
      100% { transform: translateX(-50%) scale(1); filter: brightness(1); }
    }

    @keyframes cardDamageRelease {
      0% { opacity: 1; transform: translateX(-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -18px) scale(1.25); }
    }

    @keyframes playerDamageFloat {
      0% { opacity: 0; transform: translate(-50%, 14px) scale(0.86); }
      14% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
      100% { opacity: 0; transform: translate(-50%, -62px) scale(1); }
    }

    @keyframes playerGainFloat {
      0% { opacity: 0; transform: translate(-50%, 18px) scale(0.86); }
      18% { opacity: 1; transform: translate(-50%, 0) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -48px) scale(1); }
    }

    @keyframes screenHurt {
      0%, 100% { box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38); }
      35% { box-shadow: inset 0 0 0 999px rgba(184, 27, 24, 0.2), 0 24px 80px rgba(0, 0, 0, 0.38); }
    }

    @keyframes clawSlash {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(0.2); filter: blur(1px); }
      22% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(1.08); filter: blur(0); }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) translateX(44px) scaleX(0.82); filter: blur(2px); }
    }

    @keyframes beamShoot {
      0% { opacity: 0; clip-path: inset(0 100% 0 0); filter: brightness(1); }
      18% { opacity: 1; }
      72% { opacity: 1; clip-path: inset(0 0 0 0); filter: brightness(1.8); }
      100% { opacity: 0; clip-path: inset(0 0 0 100%); filter: brightness(2); }
    }

    @keyframes readyGlow {
      0% { box-shadow: 0 0 14px rgba(255, 226, 138, 0.3); transform: translateY(0); }
      100% { box-shadow: 0 0 28px rgba(255, 226, 138, 0.62); transform: translateY(-1px); }
    }

    @keyframes buffFlash {
      0% { opacity: 0; transform: translate(-50%, -44%) scale(0.92); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -58%) scale(0.96); }
    }

    @keyframes attackNamePop {
      0% { opacity: 0; transform: translate(-50%, -42%) scale(0.86); filter: blur(2px); }
      16% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
      72% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -60%) scale(0.96); }
    }

    @media (max-width: 860px) {
      body {
        padding: 10px;
      }

      .game {
        grid-template-columns: 1fr;
      }

      .enemy {
        min-height: 0;
      }

      .enemy-art {
        width: min(100%, 780px);
        height: clamp(330px, 45vh, 470px);
      }

      .team {
        grid-template-columns: repeat(5, minmax(0, 1fr));

        gap: 4px;
        padding-inline: 6px;
      }

      .bottom-nav button {
        min-height: 40px;
        font-size: 11px;
      }
    }

    #battleScreen .side-command span {

      padding: 2px 8px;

    #battleScreen .hero-card .energy,
    #battleScreen .hero-card .card-skill-ready,

    #battleScreen .hero-energy-panel {

      gap: 6px 12px;
      align-items: center;

      font-size: 18px;
      font-weight: 800;

    #battleScreen .hero-energy-panel strong {
      color: #ffe15b;
      font-size: 20px;
    }

    #battleScreen .player-energy-bar {
      grid-column: 1 / -1;
      height: 14px;
      width: 100%;
      border: 1px solid rgba(214, 168, 74, 0.62);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.66);
      color: #ffe15b;
      overflow: hidden;
    }

    #battleScreen .hero-card.hero-strike {
      animation: heroCardStrike 460ms ease;
      box-shadow: 0 0 0 1px rgba(255, 218, 91, 0.72), 0 0 28px rgba(255, 186, 58, 0.7), inset 0 0 22px rgba(255, 186, 58, 0.16);
    }

    #battleScreen .hero-portrait.portrait-strike {
      animation: heroPortraitStrike 420ms cubic-bezier(.18, .88, .24, 1);
    }

    #battleScreen .attack-effect.light {
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 255, 236, 0.8), transparent 16%),
        linear-gradient(90deg, transparent 36%, rgba(255, 245, 190, 0.72), transparent 64%);
      filter: blur(2px);
      mix-blend-mode: screen;
    }

    #battleScreen .attack-effect.poison::before,
    #battleScreen .attack-effect.poison::after {
      content: "";
      position: absolute;
      left: 18%;
      top: 58%;
      width: 66%;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(80, 255, 118, 0.94), rgba(210, 255, 183, 0.9), transparent);
      box-shadow: 0 0 24px rgba(74, 255, 111, 0.85);
      transform: rotate(-35deg);
    }

    #battleScreen .attack-effect.poison::after {
      top: 48%;
      transform: rotate(28deg);
      opacity: 0.75;
    }

    @keyframes heroCardStrike {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-8px) scale(1.04); }
      62% { transform: translateY(2px) scale(0.99); }
    }

    @keyframes heroPortraitStrike {
      0%, 100% { transform: translateY(0) scale(1); filter: brightness(1); }
      38% { transform: translateY(-14px) scale(1.12); filter: brightness(1.55); }
      72% { transform: translateY(2px) scale(1.02); }
    }

    @keyframes boardCallout {
      0% { opacity: 0; transform: translate(-50%, -44%) scale(0.72); filter: blur(2px); }
      16% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); filter: blur(0); }
      72% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -68%) scale(0.96); }
    }

    @keyframes enemySmokeCallout {
      0% { opacity: 0; transform: translate(-50%, -38%) scale(0.75); filter: blur(7px); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); filter: blur(0); }
      60% { opacity: 1; transform: translate(-50%, -54%) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translate(-50%, -78%) scale(1.16); filter: blur(9px); }
    }

    @media (max-width: 700px) {
      #battleScreen .battle-topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .battle-actions {
        width: 100%;
      }

      #battleScreen .battle-topbar button {
        flex: 1;
      }

      #battleScreen .hero-row {
        grid-template-columns: minmax(42px, 54px) minmax(42px, 54px) minmax(140px, 168px) minmax(42px, 54px) minmax(42px, 54px);
        gap: 6px;
      }

      #battleScreen .battle-party {
        grid-template-columns: 1fr 1fr;
      }

      #battleScreen .hero-row {
        grid-column: 1 / -1;
        order: 1;
      }

      #battleScreen .player-status {
        grid-column: 1 / -1;
        order: 3;
      }

      #battleScreen .locked-slot {
        min-height: 136px;
        font-size: 16px;
      }

      #battleScreen .hero-card {
        min-height: 180px;
      }

      #battleScreen .side-command {
        width: 100%;
        min-height: 58px;
        border-radius: 10px;
        order: 2;
      }

      #battleScreen .side-command-left,
      #battleScreen .side-command-right {
        left: auto;
        right: auto;
      }
    }
  </style>
</head>
<body>
  <audio id="battleBgm" src="assets/audio/rogue_sanguo_demon_battle_loop_60s.wav" loop preload="auto"></audio>

  <main class="app">
    <section id="lobbyScreen" class="screen menu-screen active">
      <div class="hero-panel">
        <div class="war-sigil">蜀</div>
        <div class="ink-army"></div>

          <button id="startGame" class="primary-action" type="button">開始遊戲</button>
        </div>
      </div>
    </section>

    <section id="mainMenuScreen" class="screen menu-screen">
      <div class="home-panel">
        <div class="war-sigil">戰</div>
        <div class="ink-army"></div>
        <div class="menu-copy">
          <div class="eyebrow">主選單</div>
          <div class="title">軍帳</div>
          <p>整備武將、挑戰異界關卡，或前往商店與抽卡招募新的英傑。</p>
        </div>
        <div class="main-menu-grid">
          <button id="goAdventure" class="menu-tile" type="button"><strong>冒險</strong><span>挑戰虎牢妖門</span></button>
          <button id="goTeam" class="menu-tile" type="button"><strong>隊伍編成</strong><span>查看目前五色隊伍</span></button>
          <button id="goShop" class="menu-tile" type="button"><strong>商店</strong><span>物資準備中</span></button>
          <button id="goGacha" class="menu-tile" type="button"><strong>抽卡</strong><span>英傑召募準備中</span></button>
        </div>
      </div>
    </section>

    <section id="teamScreen" class="screen menu-screen">
      <div class="chapter-panel">
        <div class="war-sigil">將</div>
        <div class="ink-army"></div>
        <div class="chapter-head">
          <div>
            <div class="eyebrow">隊伍編成</div>
            <h1>三國英傑名冊</h1>
          </div>
          <button id="backMenuFromTeam" type="button">返回主選單</button>
        </div>
        <div id="rosterGrid" class="roster-grid"></div>
      </div>

    <section id="stageScreen" class="screen menu-screen">

        <div class="war-sigil">妖</div>
        <div class="ink-army"></div>

          <div>
            <div class="eyebrow">第一大關</div>
            <h1>虎牢妖門</h1>
          </div>
          <button id="backMenu" type="button">返回主選單</button>
        </div>
        <div id="stageMap" class="stage-map"></div>
      </div>
    </section>

    <section id="battleScreen" class="screen game game-shell">

      <div class="battle-topbar">
        <div id="battleStageInfo" class="battle-stage-info">第 1 層 / 回合 1/20</div>

      <div class="battle-party">

          <span id="divineGaugeText">0 / 2</span>

        <div id="team" class="team hero-row"></div>
        <button id="orderCommandButton" class="side-command side-command-right" type="button">

          <span id="orderGaugeText">0 / 2</span>

          <div class="hero-energy-panel">

        <button type="button">武將</button>

        <button class="active" type="button">戰鬥</button>
        <button type="button">鍛造</button>
        <button type="button">招募</button>
        <button type="button">商店</button>
      </nav>

      <div id="victoryPanel" class="victory-panel" aria-live="polite">
        <div class="victory-box">
          <div class="victory-title">Victory</div>
          <button id="nextStage" type="button">Next Stage</button>

      </div>

      <div id="skillDialog" class="skill-dialog" aria-live="polite">

          </div>
          <div id="skillDialogDesc" class="skill-desc"></div>
          <div class="skill-actions">
            <button id="skillCancel" type="button">取消</button>
            <button id="skillConfirm" type="button">發動</button>
          </div>
        </div>

      <div id="rewardDialog" class="reward-dialog" aria-live="polite">
        <div class="reward-box">
          <div>
            <strong>選擇軍令</strong>

          </div>
          <div id="rewardOptions" class="reward-options"></div>
        </div>
      </div>
    </section>

    <aside class="log-panel">

      <div id="log" class="log"></div>
      <div class="controls">
        <button id="newBoard">重洗盤面</button>
        <button id="restart">重新開始</button>
      </div>
    </aside>
    </section>
  </main>

    function refreshEnemyVulnerability() {
      enemyVulnerability = enemyDebuffs.reduce((sum, debuff) => {
        if (debuff.type === 'vulnerability') return sum + (debuff.layers || 0) * battleBalance.vulnerabilityPerLayer;
        return sum + (debuff.amount || 0);
      }, 0);
    }

    function renderEnemyDebuffs() {
      const el = document.getElementById('enemyDebuffs');
      if (!el) return;
      el.innerHTML = enemyDebuffs.map((debuff) => `
        <div class="enemy-debuff" title="${debuff.description || debuff.name}">
          <img src="${debuff.icon}" alt="${debuff.name}">
          <span>${debuff.type === 'vulnerability' ? `易傷 x${debuff.layers}` : debuff.type === 'burn' ? `燃燒 ${debuff.turns}` : `${Math.round((debuff.amount || 0) * 100)}% ${debuff.turns}`}</span>
        </div>
      `).join('');
    }

    function tickEnemyDebuffs() {
      enemyDebuffs.forEach((debuff) => {
        if (debuff.fresh) {
          debuff.fresh = false;
          return;
        }
        if (debuff.type === 'burn') {
          const burnDamage = Math.round(enemyMaxHp * (debuff.amount || 0));
          const dealt = damageEnemy(burnDamage, { fixed: true });
          animateAttack(dealt, true, 'red');
          addLog(`燃燒造成 ${dealt} 傷害。`);
        }
        debuff.turns--;
        if (debuff.type === 'vulnerability') debuff.layers = Math.max(0, (debuff.layers || 0) - 1);
      });
      enemyDebuffs = enemyDebuffs.filter((debuff) => debuff.turns > 0 && (debuff.type !== 'vulnerability' || debuff.layers > 0));
      refreshEnemyVulnerability();
      renderEnemyDebuffs();
    }

    function addEnemyVulnerability(layers, count, comboMultiplier) {
      const existing = enemyDebuffs.find((debuff) => debuff.type === 'vulnerability');
      const gained = Math.max(1, Math.round(layers * comboMultiplier));
      if (existing) {
        existing.layers = Math.min(battleBalance.vulnerabilityMaxLayers, (existing.layers || 0) + gained);
        existing.turns = battleBalance.vulnerabilityTurns;
        existing.fresh = true;
      } else {
        enemyDebuffs.push({
        id: 'vulnerability',
        type: 'vulnerability',
        name: '易傷',
        layers: Math.min(battleBalance.vulnerabilityMaxLayers, gained),
        turns: battleBalance.vulnerabilityTurns,
        fresh: true,
        icon: 'assets/rogue/buffs/buff_sorcery_.png',
      });
      }
      refreshEnemyVulnerability();
      renderEnemyDebuffs();
      const current = enemyDebuffs.find((debuff) => debuff.type === 'vulnerability');
      showEnemyStatusCallout(`易傷 x${current?.layers ?? gained}`);
      addLog(`暗特性 ${count} 消，敵人易傷 +${gained} 層（COMBO x${comboMultiplier.toFixed(2)}）。`);
    }

    function addEnemyBurn() {
      const existing = enemyDebuffs.find((debuff) => debuff.type === 'burn');
      if (existing) {
        existing.turns = Math.max(existing.turns, battleBalance.enhancedFireBurnTurns);
        existing.fresh = true;
      } else {
        enemyDebuffs.push({
          id: 'burn',
          type: 'burn',
          name: '燃燒',
          description: '每回合受到最大 HP 5% 傷害。',
          amount: battleBalance.enhancedFireBurnMaxHp,
          turns: battleBalance.enhancedFireBurnTurns,
          fresh: true,
          icon: 'assets/rogue/buffs/buff_attack_up_.png',
        });
      }
      renderEnemyDebuffs();
      showBuffFlash('🔥燃燒');
    }

    function applyPlayerDamage(amount) {
      if (divineStates.invincibleTurns > 0) {
        showBuffFlash('八陣圖：無敵');
        addLog('八陣圖擋下了敵人的攻擊。');
        return 0;
      }
      let damage = amount;
      if (ironWallTurns > 0) {
        damage = Math.round(damage * (1 - battleBalance.ironWallReduction));
        showBuffFlash('鐵壁 -30%');
      }
      if (divineStates.damageReductionTurns > 0 && divineStates.damageReductionRate > 0) {
        damage = Math.round(damage * (1 - divineStates.damageReductionRate));
        showBuffFlash(`八陣圖 -${Math.round(divineStates.damageReductionRate * 100)}%`);
      }
      const blocked = Math.min(playerShield, damage);
      if (blocked > 0) {
        playerShield -= blocked;
        damage -= blocked;
        addLog(`護盾抵擋 ${blocked} 傷害。`);
        if (shieldCounterReady) {
          const counterDamage = Math.round(blocked * battleBalance.shieldCounterRate);
          if (counterDamage > 0) pendingShieldCounterDamage += counterDamage;
          shieldCounterReady = false;
        }
      }
      playerHp = Math.max(0, playerHp - damage);
      if (damage > 0) showPlayerDamage(damage);
      return damage;
    }

    function tickRogueTurnBuffs() {
      if (playerShieldTurns > 0) {
        playerShieldTurns--;
        if (playerShieldTurns <= 0) {
          playerShield = 0;
          addLog('木護盾消散。');
        }
      }
    }

    function tryHeroPassiveOnTrait(color) {
      const passive = playerHero.passiveSkill;
      if (passive?.type !== 'crimson_bomb_on_red_orb_match' || playerHero.orbAffinity !== color) return 0;
      if (Math.random() >= passive.chance) return;
      const minBombs = passive.minBombs ?? battleBalance.zhaoPassiveMinBombs;
      const maxBombs = passive.maxBombs ?? battleBalance.zhaoPassiveMaxBombs;
      const requested = minBombs + Math.floor(Math.random() * (maxBombs - minBombs + 1));
      const bombed = destroyRandomOrbsByColor('red', requested);
      if (!bombed) return 0;
      const damage = Math.round(playerHero.attack * (passive.damagePerOrbAtk ?? battleBalance.bombDamageAtkPerOrb) * bombed);
      playPassiveSfx();
      triggerBoardBurst(`${passive.name}・緋紅爆破 ${bombed}`, 'fire');
      addLog(`${playerHero.hero} 被動「${passive.name}」觸發，引爆 ${bombed} 顆緋紅珠。`);
      return { count: bombed, damage };
    }

    function getCurrentStage() {
      return stageData[stage - 1];
    }

    function getPlayerAttackMultiplier() {
      let multiplier = playerStatusEffects.reduce((value, effect) => {
        if (effect.type === 'attackDown') return value * (1 - effect.amount);
        return value;
      }, 1);
      activeBuffs.forEach((buff) => {
        if (buff.type === 'attack_up') multiplier *= 1 + buff.value;
      });
      return multiplier;
    }

    function getComboDamageMultiplier(combo) {
      const buff = activeBuffs.find((item) => item.type === 'combo_damage');
      const base = getComboBaseMultiplier(combo);
      const buffBonus = buff ? Math.max(0, combo - 1) * buff.value : 0;
      return base * (1 + buffBonus);
    }

    function getComboBaseMultiplier(combo) {
      return 1 + Math.max(0, combo - 1) * battleBalance.comboMultiplierStep;
    }

    function getBuff(type) {
      return activeBuffs.find((buff) => buff.type === type);
    }

    function addOrRefreshBuff(reward) {
      const existing = activeBuffs.find((buff) => buff.id === reward.id);
      if (existing) {
        existing.stacks = (existing.stacks || 1) + 1;
        existing.value = reward.value * existing.stacks;
        existing.turns = Math.max(existing.turns, reward.durationTurns);
      } else {
        activeBuffs.push({ ...reward, baseValue: reward.value, stacks: 1, turns: reward.durationTurns });
      }
      const current = activeBuffs.find((buff) => buff.id === reward.id);
      showBuffFlash(`${reward.name} x${current?.stacks ?? 1}`);
      renderBuffs();
    }

    function formatBuffValue(buff) {
      if (typeof buff.value !== 'number') return '';
      if (['attack_up', 'follow_up', 'combo_damage'].includes(buff.type)) return ` ${Math.round(buff.value * 100)}%`;
      return '';
    }

    function renderBuffs() {
      buffRowEl.innerHTML = activeBuffs.map((buff) => `
        <div class="buff-chip" title="${buff.description}">
          <img src="${buff.buffIcon}" alt="${buff.name}">
          <span>${buff.name}${formatBuffValue(buff)} ${buff.turns > 0 ? buff.turns : ''}</span>
        </div>
      `).join('');
    }

    function tickBuffs() {
      activeBuffs.forEach((buff) => {
        if (buff.turns > 0) buff.turns--;
      });
      activeBuffs = activeBuffs.filter((buff) => buff.turns !== 0);
      tickEnemyDebuffs();
      tickDivineStates();
      renderBuffs();
    }

    function tickDivineStates() {
      if (divineStates.invincibleTurns > 0) divineStates.invincibleTurns--;
      if (divineStates.enemyAttackDebuffTurns > 0) {
        divineStates.enemyAttackDebuffTurns--;
        if (divineStates.enemyAttackDebuffTurns <= 0) divineStates.enemyAttackMultiplier = 1;
      }
      if (divineStates.damageReductionTurns > 0) {
        divineStates.damageReductionTurns--;
        if (divineStates.damageReductionTurns <= 0) divineStates.damageReductionRate = 0;
      }
      Object.keys(divineStates.enabledAttackColors).forEach((color) => {
        divineStates.enabledAttackColors[color]--;
        if (divineStates.enabledAttackColors[color] <= 0) delete divineStates.enabledAttackColors[color];
      });
      if (ironWallTurns > 0) ironWallTurns--;
    }

    function addDivineGauge(count) {

      divineGauge = Math.min(battleBalance.divineGaugeMax, divineGauge + gain);

    function addOverflowRewards(totalCleared) {
      if (totalCleared >= 8) {
        orderGauge = Math.min(battleBalance.orderGaugeMax, orderGauge + 1);
        divineGauge = Math.min(battleBalance.divineGaugeMax, divineGauge + 1);

        triggerBoardBurst('奇策連鎖！', 'light');

      if (totalCleared >= 10) {

        if (reward) {
          if (reward.type === 'color_convert') convertRandomBoardColor();
          else addOrRefreshBuff(reward);
          showBuffFlash(`奇策：${reward.name}`);
          addLog(`大型消除獲得 ${reward.name}。`);

      }

    function renderCommandGauges() {
      if (divineGaugeTextEl) divineGaugeTextEl.textContent = `${divineGauge} / ${battleBalance.divineGaugeMax}`;
      if (orderGaugeTextEl) orderGaugeTextEl.textContent = `${orderGauge} / ${battleBalance.orderGaugeMax}`;

      orderCommandButtonEl?.classList.toggle('ready', orderGauge >= battleBalance.orderGaugeMax);

    function triggerBoardBurst(text, type = 'fire') {

    function cleanseOnePlayerDebuff() {
      const index = playerStatusEffects.findIndex((effect) => ['burn', 'poison', 'attackDown', 'slow', 'freeze'].includes(effect.type));
      if (index < 0) return false;
      const [removed] = playerStatusEffects.splice(index, 1);
      showBuffFlash('光淨化');
      addLog(`光特性清除了 ${removed.type}。`);
      return true;
    }

    function destroyRandomNonSpecialOrb() {
      const candidates = [];
      board.forEach((row, y) => row.forEach((cell, x) => {
        if (cell && !cell.special) candidates.push({ x, y });
      }));
      if (!candidates.length) return false;
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      board[target.y][target.x] = null;
      dropKeys = collapseBoard();
      renderBoard();
      window.setTimeout(() => {
        dropKeys = new Set();
        renderBoard();
      }, 260);
      return 1;
    }

    function destroyRandomOrbsByColor(color, requestedCount) {
      const candidates = [];
      board.forEach((row, y) => row.forEach((cell, x) => {
        if (cell && !cell.special && cellColor(cell) === color) candidates.push({ x, y });
      }));
      if (!candidates.length) return 0;
      let destroyed = 0;
      const count = Math.min(requestedCount, candidates.length);
      for (let i = 0; i < count; i++) {
        const index = Math.floor(Math.random() * candidates.length);
        const target = candidates.splice(index, 1)[0];
        if (!target) continue;
        board[target.y][target.x] = null;
        destroyed++;
      }
      if (destroyed > 0) {
        dropKeys = collapseBoard();
        renderBoard();
        window.setTimeout(() => {
          dropKeys = new Set();
          renderBoard();
        }, 260);
      }
      return destroyed;
    }

    function getBombDamage(destroyedCount) {
      if (destroyedCount <= 0) return 0;
      return Math.round(playerHero.attack * battleBalance.bombDamageAtkPerOrb * destroyedCount * getPlayerAttackMultiplier());
    }

    function applyBombDamage(destroyedCount, color = 'yellow', deferVisual = false) {
      if (destroyedCount <= 0) return 0;
      const damage = getBombDamage(destroyedCount);
      if (deferVisual) {
        addLog(`炸珠蓄力 ${damage} 傷害。`);
        return damage;
      }
      const dealt = damageEnemy(damage);
      if (!deferVisual) animateAttack(dealt, true, color);
      addLog(`炸珠追加 ${dealt} 傷害。`);
      return dealt;
    }

    function playHeroVoice(src) {
      if (!src) return;
      const sound = new Audio(src);
      sound.volume = 0.82;
      sound.play().catch(() => {});
    }

    function playPassiveSfx() {
      const sound = new Audio('assets/audio/sfx_hero_zhaoyun_passive_courage_trigger_ding_01.wav');
      sound.volume = 0.72;
      sound.play().catch(() => {});
    }

    function playRewardSfx(reward) {
      if (!reward?.sfx) return;
      const sound = new Audio(reward.sfx);
      sound.volume = 0.82;
      sound.play().catch(() => {});
    }

    function addPlayerStatus(effect) {
      const existing = playerStatusEffects.find((item) => item.type === effect.type);
      if (existing) {
        existing.turns = Math.max(existing.turns, effect.turns);
        existing.damage = effect.damage ?? existing.damage;
        existing.amount = effect.amount ?? existing.amount;
      } else {
        playerStatusEffects.push(effect);
      }
    }

    function tickPlayerStatuses() {
      let dotDamage = 0;
      playerStatusEffects.forEach((effect) => {
        if (effect.type === 'burn' || effect.type === 'poison') dotDamage += effect.damage;
        effect.turns--;
      });
      playerStatusEffects = playerStatusEffects.filter((effect) => effect.turns > 0);
      if (dotDamage > 0) {
        playerHp = Math.max(0, playerHp - dotDamage);
        showPlayerDamage(dotDamage);
        addLog(`異常狀態造成 ${dotDamage} 傷害。`);
      }
    }

    function damageEnemy(amount, options = {}) {
      if (options.fixed) {
        const damage = Math.min(enemyHp, Math.max(0, Math.round(amount)));
        enemyHp = Math.max(0, enemyHp - damage);
        return damage;
      }
      let damage = amount;
      if (enemyVulnerability > 0) {
        damage = Math.round(damage * (1 + enemyVulnerability));
      }
      if (enemyDamageReduction > 0) {
        damage = Math.round(damage * (1 - enemyDamageReduction));
        enemyDamageReduction = 0;
        addLog('敵人的減傷抵消了一部分傷害。');
      }
      const shieldBlocked = Math.min(enemyShield, damage);
      if (shieldBlocked > 0) {
        enemyShield -= shieldBlocked;
        damage -= shieldBlocked;
        addLog(`敵人護盾吸收 ${shieldBlocked} 傷害。`);
      }
      enemyHp = Math.max(0, enemyHp - damage);
      return damage;
    }

    function showScreen(name) {
      Object.entries(screens).forEach(([key, screen]) => {
        const active = key === name;
        screen.classList.toggle('active', active);
        screen.style.display = active ? 'grid' : 'none';
      });
      if (name === 'battle') battleEl.style.display = 'grid';
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function renderStageMap() {
      stageMapEl.innerHTML = stageData.map((data, index) => `
        <button class="stage-node" data-stage="${index + 1}" type="button">
          <span>${index + 1}. ${data.name}</span>
          <small>妖力 ${data.hp}</small>
        </button>
      `).join('');
      stageMapEl.querySelectorAll('[data-stage]').forEach((button) => {
        button.addEventListener('click', () => {
          startBattleBgm();
          selectedStage = Number(button.dataset.stage);
          stage = selectedStage;
          logEl.innerHTML = '';
          resultEl.textContent = '';
          showScreen('battle');
          startStage(true);
          addLog(`虎牢妖門 ${selectedStage}：${stageData[selectedStage - 1].name} 出現。`);
        });
      });
    }

    function makeOrb(color = randomColor(), special = false, power = 'cross') {
      return { color, special, power };
    }

    function cellColor(cell) {
      const color = typeof cell === 'string' ? cell : cell?.color;
      if (color === 'enhancedRed') return 'red';
      return color;
    }

    function rawCellColor(cell) {
      return typeof cell === 'string' ? cell : cell?.color;
    }

    function cellClass(cell) {
      const raw = rawCellColor(cell);
      if (raw === 'enhancedRed') return 'red extra-fire';
      if (raw === 'rainbow') return 'rainbow';
      return cellColor(cell);
    }

    function matchColor(cell) {
      if (cell?.special) return null;
      const color = cellColor(cell);
      return color === 'rainbow' ? null : color;
    }

    function createBoard() {
      board = Array.from({ length: height }, () => Array.from({ length: width }, () => makeOrb()));
      while (findMatches().groups.length) {
        board = Array.from({ length: height }, () => Array.from({ length: width }, () => makeOrb()));
      }
      selected = null;
      dropKeys = new Set();
      renderBoard();
    }

    function renderTeam() {
      teamEl.innerHTML = `
        <div class="card equipment-card locked-slot">武器</div>
        <div class="card equipment-card locked-slot">甲冑</div>

          <div class="portrait red hero-portrait">

    function openSkillDialog() {
      if (busy || enemyHp <= 0 || playerHp <= 0) return;
      const ready = playerHero.energy >= playerHero.maxEnergy;
      pendingSkillColor = ready ? 'hero' : null;
      skillDialogImageEl.src = playerHero.art.card;
      skillDialogImageEl.alt = playerHero.hero;
      skillDialogTitleEl.textContent = playerHero.hero;
      skillDialogHeroEl.textContent = `${playerHero.hero} / ${playerHero.title}`;
      skillDialogDescEl.textContent = `主動：${playerHero.skillName}，${playerHero.skillDescription} 被動：${playerHero.passiveSkill.name}，${playerHero.passiveSkill.description}`;
      skillConfirmEl.disabled = !ready;

    function closeSkillDialog() {
      pendingSkillColor = null;
      skillDialogEl.classList.remove('show');
      skillConfirmEl.disabled = false;
      skillConfirmEl.textContent = '發動';
    }

    function pickRewards(count = 3) {
      const pool = [...rogueRewards];
      const picked = [];
      while (picked.length < count && pool.length) {
        const index = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(index, 1)[0]);
      }
      return picked;
    }

    function pickDivineFlags(count = 3) {
      const pool = [...divineFlagsPack.flags];
      const picked = [];
      while (picked.length < count && pool.length) {
        const index = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(index, 1)[0]);
      }
      return picked;
    }

    function openRewardDialog(cell) {
      rewardSourceCell = cell;
      rewardMode = 'rogue';
      rewardDialogEl.querySelector('strong').textContent = '選擇軍令';
      rewardDialogEl.querySelector('.roster-flavor').textContent = '選擇一個 BUFF，本次探索立即生效。';
      rewardOptionsEl.innerHTML = pickRewards(3).map((reward) => `
        <button class="reward-card" data-reward="${reward.id}" type="button">
          <img src="${reward.icon}" alt="${reward.name}">
          <strong>${reward.name}</strong>
          <span>${reward.description}</span>
        </button>
      `).join('');
      rewardOptionsEl.querySelectorAll('[data-reward]').forEach((button) => {
        button.addEventListener('click', () => chooseReward(button.dataset.reward));
      });
      rewardDialogEl.classList.add('show');
